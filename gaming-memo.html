<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Gaming Memo - Digital Display</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111b2b;--line:#293b58;--mint:#a8ffef;--amber:#ffcc66;--muted:#9aabc4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#233c61 0,#0b1220 55%,#070b13 100%);color:#edf4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{max-width:960px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-size:clamp(1.5rem,4vw,2.2rem);margin:0;letter-spacing:.08em}
.kicker{color:var(--mint);font-size:.75rem;letter-spacing:.2em}
.panel{background:linear-gradient(145deg,rgba(20,33,53,.96),rgba(12,21,36,.96));border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 18px 45px #0005}
.board{--board-bg:#050b16;--board-fg:#a8ffef;overflow:hidden;position:relative;min-height:220px;display:flex;align-items:center;justify-content:center;background:var(--board-bg);border:8px solid #30415c;border-radius:14px;box-shadow:inset 0 0 34px #000b,0 0 28px #4e83c533;padding:32px 0}
.board:before,.board:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}
.board:before{background:repeating-linear-gradient(0deg,transparent 0 3px,#0002 4px)}
.board:after{background:linear-gradient(90deg,var(--board-bg) 0%,transparent 9%,transparent 91%,var(--board-bg) 100%)}
.track{white-space:nowrap;display:inline-block;padding-left:100%;font-size:clamp(2rem,7vw,4.2rem);font-weight:850;letter-spacing:.06em;color:var(--board-fg);text-shadow:0 0 16px #a8ffef55;animation:scroll 12s linear infinite}
.track.paused{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.board-label{position:absolute;top:10px;left:14px;color:#7187a5;font:700 .65rem "Courier New",monospace;letter-spacing:.16em;z-index:3}
.board.blink-mode{--board-bg:#f4f7ff;--board-fg:#101b35;background:#f4f7ff}
.board.blink-mode .track{padding:0 3vw;white-space:normal;text-align:center;width:100%;animation:blink-colors 1s steps(1,end) infinite}
.board.blink-mode:after{display:none}
@keyframes blink-colors{0%,49%{color:#101b35;background:#f4f7ff}50%,100%{color:#f4f7ff;background:#101b35}}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{border:1px solid #49617e;background:#243650;color:#f4fbff;border-radius:10px;padding:11px 16px;font:600 .95rem system-ui,sans-serif;cursor:pointer}
button:hover{filter:brightness(1.18)}
button.primary,button.selected{background:var(--mint);border-color:var(--mint);color:#07151b;box-shadow:0 0 16px #a8ffef33}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
h2{font-size:1.1rem;margin:0}
small,.hint{color:var(--muted)}
textarea{width:100%;min-height:180px;resize:vertical;background:#0a1322;color:#eff8ff;border:1px solid var(--line);border-radius:10px;padding:13px;font:.98rem/1.8 system-ui,sans-serif}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
label{color:#c5d5e8;font-size:.9rem}
input[type=number]{width:82px;background:#0a1322;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px}
.status{color:var(--amber);font-size:.85rem;margin-left:auto}
footer{text-align:center;color:#7185a5;font-size:.8rem;padding:12px}
.board:fullscreen{width:100vw;height:100vh;min-height:100vh;border:0;border-radius:0;padding:4vw;box-shadow:none;display:flex;align-items:center;justify-content:center}
.board:fullscreen .track{font-size:clamp(2.5rem,9vw,9rem)}
.board:fullscreen.blink-mode .track{font-size:clamp(3rem,12vw,11rem)}
.board:fullscreen .board-label{top:3vh;left:3vw}
@media(max-width:560px){body{padding:16px}.panel{padding:15px}.board{min-height:160px}.status{width:100%;margin-left:0}}
</style>
</head>
<body>
<main>
<header><div><div class="kicker">RANDOM MESSAGE DISPLAY</div><h1>GAMING MEMO</h1></div><div aria-hidden="true">▰ ▰ ▰</div></header>
<section class="panel" aria-label="電光掲示板">
<div class="board" id="board"><div class="board-label">NOW DISPLAYING</div><div id="track" class="track">メッセージを登録してください</div></div>
<div class="controls">
<button class="primary" id="next">次のメッセージ ▶</button>
<button id="modeScroll" class="selected">流す</button>
<button id="modeBlink">点滅</button>
<button id="toggle">一時停止</button>
<button id="shuffle">ランダム再生</button>
<button id="fullscreen">⛶ 表示部分を全画面</button>
</div>
</section>
<section class="panel">
<div class="section-title"><h2>表示する文字列</h2><small>1行につき1つ登録</small></div>
<textarea id="items" spellcheck="false" aria-label="表示する文字列" placeholder="例：
今日の目標：ランクアップ
忘れずに装備を変更
イベント開始は20時"></textarea>
<div class="row">
<button class="primary" id="save">リストを保存</button>
<button id="clear">すべて消去</button>
<label for="speed">流れる速さ</label>
<input id="speed" type="number" min="5" max="40" value="12">
<label>秒 / 画面幅</label>
<span class="status" id="status" role="status">未保存の変更があります</span>
</div>
<p class="hint">入力した文字列はこのブラウザーに保存されます。保存後、「次のメッセージ」または「ランダム再生」で表示できます。</p>
</section>
<footer>GAMING MEMO · DIGITAL SIGNAGE STYLE</footer>
</main>
<script>
(()=>{
 const area=document.getElementById("items"),track=document.getElementById("track"),status=document.getElementById("status"),speed=document.getElementById("speed"),board=document.getElementById("board");
 let messages=[],last=-1,playing=true,mode="scroll";
 try{messages=JSON.parse(localStorage.getItem("gamingMemoMessages")||"[]")}catch{}
 area.value=messages.join("\n");
 function updateStatus(text){status.textContent=text}
 function setMessage(text){
  track.textContent=text;
  track.style.animation="none";void track.offsetWidth;
  track.style.animationDuration=(Math.max(5,Math.min(40,Number(speed.value)||12)))+"s";
  track.style.animation=mode==="scroll"?"scroll "+track.style.animationDuration+" linear infinite":"";
  track.classList.toggle("paused",!playing);
  board.classList.toggle("blink-mode",mode==="blink");
 }
 function pick(){
  const list=area.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!list.length){setMessage("文字列を登録してください");updateStatus("表示できる文字列がありません");return}
  let index=Math.floor(Math.random()*list.length);
  if(list.length>1&&index===last)index=(index+1+Math.floor(Math.random()*(list.length-1)))%list.length;
  last=index;setMessage(list[index]);updateStatus((index+1)+" / "+list.length+" 件目を表示中");
 }
 function setMode(nextMode){
  mode=nextMode;
  document.getElementById("modeScroll").classList.toggle("selected",mode==="scroll");
  document.getElementById("modeBlink").classList.toggle("selected",mode==="blink");
  setMessage(track.textContent);
 }
 document.getElementById("next").addEventListener("click",pick);
 document.getElementById("modeScroll").addEventListener("click",()=>setMode("scroll"));
 document.getElementById("modeBlink").addEventListener("click",()=>setMode("blink"));
 document.getElementById("toggle").addEventListener("click",e=>{
  playing=!playing;track.classList.toggle("paused",!playing);e.currentTarget.textContent=playing?"一時停止":"再生";
 });
 document.getElementById("shuffle").addEventListener("click",()=>{
  pick();playing=true;track.classList.remove("paused");document.getElementById("toggle").textContent="一時停止";
 });
 document.getElementById("fullscreen").addEventListener("click",async()=>{
  try{
   if(!document.fullscreenElement){
    await board.requestFullscreen();
    try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock("landscape")}catch{}
   }else{
    await document.exitFullscreen();
    try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch{}
   }
  }catch(error){updateStatus("全画面表示に対応していないブラウザーです")}
 });
 document.addEventListener("fullscreenchange",()=>{
  document.getElementById("fullscreen").textContent=document.fullscreenElement?"全画面を終了":"⛶ 表示部分を全画面";
 });
 document.getElementById("save").addEventListener("click",()=>{
  messages=area.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  localStorage.setItem("gamingMemoMessages",JSON.stringify(messages));updateStatus(messages.length+" 件を保存しました");
  if(messages.length)pick();else setMessage("文字列を登録してください");
 });
 document.getElementById("clear").addEventListener("click",()=>{
  area.value="";messages=[];localStorage.removeItem("gamingMemoMessages");last=-1;setMessage("文字列を登録してください");updateStatus("リストを消去しました");
 });
 area.addEventListener("input",()=>updateStatus("未保存の変更があります"));
 speed.addEventListener("change",()=>{if(mode==="scroll")track.style.animationDuration=(Math.max(5,Math.min(40,Number(speed.value)||12)))+"s"});
 if(messages.length)pick();
})();
</script>
</body>
</html>
