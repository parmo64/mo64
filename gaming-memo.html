<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Gaming Memo</title>
<style>
:root{color-scheme:dark;--panel:#172235;--line:#34445e;--mint:#a8ffdf;--muted:#a7b4c9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#111d32,#080d18 70%);color:#eef4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{max-width:960px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-size:clamp(1.5rem,4vw,2.2rem);margin:0;letter-spacing:.05em}
.kicker{color:var(--mint);font-size:.75rem;letter-spacing:.16em}
.panel{background:rgba(23,34,53,.92);border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 16px 40px #0003}
.board{--board-bg:#e8f0ff;--board-fg:#17243a;overflow:hidden;position:relative;min-height:230px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8f0ff,#cbd9f0);border:1px solid #ffffff35;border-radius:22px;padding:34px 0;box-shadow:0 12px 35px #0003;transition:background .25s,color .25s}
.track{white-space:nowrap;display:inline-block;padding-left:100%;font-size:clamp(2rem,7vw,4.2rem);font-weight:800;letter-spacing:.025em;color:#17243a;animation:scroll 12s linear infinite}
.track.paused{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.board.blink-mode{background:#17243a}
.board.blink-mode .track{padding:0 3vw;white-space:normal;text-align:center;width:100%;animation:blink-colors 1s steps(1,end) infinite}
@keyframes blink-colors{0%,49%{color:#17243a;background:#e8f0ff}50%,100%{color:#e8f0ff;background:#17243a}}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
button{border:1px solid #536782;background:#293a55;color:#f4f8ff;border-radius:11px;padding:11px 16px;font:600 .95rem system-ui,sans-serif;cursor:pointer}
button:hover{filter:brightness(1.18)}
button.primary{background:var(--mint);border-color:var(--mint);color:#10251e}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #ffcf70;outline-offset:3px}
.mode-note{margin-left:auto;color:var(--mint);font-size:.9rem}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
h2{font-size:1.1rem;margin:0}
small,.hint{color:var(--muted)}
textarea{width:100%;min-height:180px;resize:vertical;background:#0d1728;color:#eff5ff;border:1px solid var(--line);border-radius:12px;padding:13px;font:.98rem/1.8 system-ui,sans-serif}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
label{color:#c5d2e5;font-size:.9rem}
input[type=number]{width:82px;background:#0d1728;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px}
.status{color:#ffcf70;font-size:.85rem;margin-left:auto}
footer{text-align:center;color:#8292aa;font-size:.8rem;padding:12px}
.board:fullscreen{width:100vw;height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;border:0;border-radius:0;padding:4vw;box-shadow:none;display:flex;align-items:center;justify-content:center}
.board:fullscreen .track{font-size:clamp(2rem,8vw,9rem);max-width:100%}
@media(orientation:portrait){
 .board:fullscreen{padding:6vh 4vw}
 .board:fullscreen .track{font-size:clamp(2rem,10vw,6rem);white-space:normal;overflow-wrap:anywhere;text-align:center}
}
@media(orientation:landscape){
 .board:fullscreen{padding:4vw 6vh}
 .board:fullscreen .track{font-size:clamp(2.5rem,8vw,9rem)}
}
@media(max-width:560px){body{padding:16px}.panel{padding:15px}.board{min-height:170px}.status,.mode-note{width:100%;margin-left:0}}
</style>
</head>
<body>
<main>
<header><div><div class="kicker">RANDOM MESSAGE</div><h1>GAMING MEMO</h1></div></header>
<section class="panel" aria-label="メッセージ表示">
<div class="board" id="board"><div id="track" class="track">メッセージを登録してください</div></div>
<div class="controls">
<button class="primary" id="next">次のメッセージ ▶</button>
<button id="toggle">一時停止</button>
<button id="shuffle">ランダム再生</button>
<button id="fullscreen">⛶ 表示部分を全画面</button>
<span class="mode-note" id="modeNote">表示方法：ランダム</span>
</div>
</section>
<section class="panel">
<div class="section-title"><h2>表示する文字列</h2><small>1行につき1つ登録</small></div>
<textarea id="items" spellcheck="false" aria-label="表示する文字列" placeholder="例：
今日の目標：ランクアップ
忘れずに装備を変更
イベント開始は20時"></textarea>
<div class="row">
<button class="primary" id="save">リストを保存</button>
<button id="clear">すべて消去</button>
<label for="speed">流れる速さ</label>
<input id="speed" type="number" min="1" max="40" value="1">
<label>秒 / 画面幅</label>
<span class="status" id="status" role="status">未保存の変更があります</span>
</div>
<p class="hint">文字列はこのブラウザーに保存されます。上から順番に表示し、「流す」「点滅」を交互に切り替えます。</p>
</section>
<footer>GAMING MEMO</footer>
</main>
<script>
(()=>{
 const area=document.getElementById("items"),track=document.getElementById("track"),status=document.getElementById("status"),speed=document.getElementById("speed"),board=document.getElementById("board"),modeNote=document.getElementById("modeNote");
 let messages=[],last=-1,playing=true,mode="scroll";
 try{messages=JSON.parse(localStorage.getItem("gamingMemoMessages")||"[]")}catch{}
 area.value=messages.join("\n");
 function updateStatus(text){status.textContent=text}
 function setMessage(text){
  track.textContent=text;
  track.style.animation="none";void track.offsetWidth;
  track.style.animationDuration=(Math.max(1,Math.min(40,Number(speed.value)||1)))+"s";
  track.style.animation=mode==="scroll"?"scroll "+track.style.animationDuration+" linear infinite":"";
  track.classList.toggle("paused",!playing);
  board.classList.toggle("blink-mode",mode==="blink");
  modeNote.textContent="表示方法："+(mode==="scroll"?"流す":"点滅");
 }
 function pick(){
  const list=area.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!list.length){setMessage("文字列を登録してください");updateStatus("表示できる文字列がありません");return}
  const index=(last+1)%list.length;
  last=index;
  mode=mode==="scroll"?"blink":"scroll";
  setMessage(list[index]);updateStatus((index+1)+" / "+list.length+" 件目を表示中");
 }
 document.getElementById("next").addEventListener("click",pick);
 document.getElementById("toggle").addEventListener("click",e=>{
  playing=!playing;track.classList.toggle("paused",!playing);e.currentTarget.textContent=playing?"一時停止":"再生";
 });
 document.getElementById("shuffle").addEventListener("click",()=>{
  playing=true;track.classList.remove("paused");document.getElementById("toggle").textContent="一時停止";pick();
 });
 document.getElementById("fullscreen").addEventListener("click",async()=>{
  try{
   if(!document.fullscreenElement){
    await board.requestFullscreen();
   }else{
    await document.exitFullscreen();
   }
  }catch(error){updateStatus("全画面表示に対応していないブラウザーです")}
 });
 document.addEventListener("fullscreenchange",()=>{
  document.getElementById("fullscreen").textContent=document.fullscreenElement?"全画面を終了":"⛶ 表示部分を全画面";
 });
 document.getElementById("save").addEventListener("click",()=>{
  messages=area.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  localStorage.setItem("gamingMemoMessages",JSON.stringify(messages));updateStatus(messages.length+" 件を保存しました");
  if(messages.length)pick();else setMessage("文字列を登録してください");
 });
 document.getElementById("clear").addEventListener("click",()=>{
  area.value="";messages=[];localStorage.removeItem("gamingMemoMessages");last=-1;setMessage("文字列を登録してください");updateStatus("リストを消去しました");
 });
 area.addEventListener("input",()=>updateStatus("未保存の変更があります"));
 speed.addEventListener("change",()=>{if(mode==="scroll")track.style.animationDuration=(Math.max(1,Math.min(40,Number(speed.value)||1)))+"s"});
 if(messages.length)pick();
})();
</script>
</body>
</html>
