<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171923">
  <title>ゆっくり読み上げ</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11131a;
      --panel: #1b1e29;
      --panel-2: #242837;
      --text: #f4f5fb;
      --muted: #9da5b8;
      --accent: #9b8cff;
      --accent-2: #7865e8;
      --border: #34394b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #22243a 0, var(--bg) 52%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
    }
    main { width: min(900px, 100%); margin: 0 auto; padding: 28px 18px 48px; }
    header { margin-bottom: 22px; }
    h1 { margin: 0 0 7px; font-size: clamp(24px, 5vw, 32px); letter-spacing: .02em; }
    .sub { margin: 0; color: var(--muted); font-size: 14px; }
    .panel {
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 36px #0003;
    }
    label { display: block; font-weight: 650; margin: 0 0 10px; }
    textarea {
      display: block;
      width: 100%;
      min-height: 190px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #121520;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      line-height: 1.8;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #9b8cff22; }
    .meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    button {
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 20px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary { background: var(--accent-2); border-color: var(--accent-2); color: white; flex: 1; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:not(:disabled):active { transform: translateY(1px); }
    .status { min-height: 24px; margin: 13px 2px 0; color: var(--muted); font-size: 13px; }
    .stage { margin-top: 18px; }
    .stage-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
    .stage-head h2 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 650; }
    #counter { color: var(--muted); font-size: 12px; }
    .caption {
      min-height: 150px;
      display: grid;
      place-items: center;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #0c0f17;
      text-align: center;
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 750;
      line-height: 1.65;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .caption.empty { color: #697187; font-size: 16px; font-weight: 500; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.7; margin: 14px 2px 0; }
    @media (max-width: 520px) {
      main { padding: 22px 13px 34px; }
      .panel { padding: 14px; }
      .caption { min-height: 130px; padding: 18px; }
      button { padding: 0 15px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ゆっくり読み上げ</h1>
      <p class="sub">入力した文章を、魔理沙の声で1行ずつ読み上げます。</p>
    </header>

    <section class="panel">
      <label for="textInput">読み上げるテキスト</label>
      <textarea id="textInput" placeholder="ここに文章を入力してください。&#10;改行した位置で、読み上げとテロップが切り替わります。"></textarea>
      <div class="meta">
        <span>改行ごとに読み上げ</span>
        <span id="lineCount">0行</span>
      </div>
      <div class="actions">
        <button class="primary" id="playButton">▶ 読み上げ開始</button>
        <button id="stopButton" disabled>■ 停止</button>
        <button id="clearButton">クリア</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">準備完了</p>

      <div class="stage">
        <div class="stage-head">
          <h2>テロップ</h2>
          <span id="counter">待機中</span>
        </div>
        <div class="caption empty" id="caption" aria-live="polite">ここに読み上げ中の文章が表示されます</div>
      </div>
      <p class="hint">音声：AquesTalk1 f2（ゆっくり魔理沙）／話速：110%。初回再生時に音声エンジンを読み込みます。</p>
    </section>
  </main>

  <script type="module">
    import { load } from "https://esm.sh/yukumo.js";
    import { loadAqKanji2Koe } from "https://esm.sh/yukumo.js/lang/kanji2koe";

    const input = document.getElementById("textInput");
    const playButton = document.getElementById("playButton");
    const stopButton = document.getElementById("stopButton");
    const clearButton = document.getElementById("clearButton");
    const status = document.getElementById("status");
    const caption = document.getElementById("caption");
    const counter = document.getElementById("counter");
    const lineCount = document.getElementById("lineCount");

    let enginePromise = null;
    let engine = null;
    let converter = null;
    let currentAudio = null;
    let currentUrl = null;
    let runToken = 0;
    let isPlaying = false;

    function getLines() {
      return input.value.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
    }

    function updateLineCount() {
      const count = getLines().length;
      lineCount.textContent = count + "行";
    }

    function setCaption(text, index, total) {
      caption.textContent = text;
      caption.classList.remove("empty");
      counter.textContent = (index + 1) + " / " + total;
    }

    function clearAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.src = "";
        currentAudio = null;
      }
      if (currentUrl) {
        URL.revokeObjectURL(currentUrl);
        currentUrl = null;
      }
    }

    async function loadEngine() {
      if (!enginePromise) {
        enginePromise = (async () => {
          status.textContent = "音声エンジンを読み込み中…";
          const [voice, kanaConverter] = await Promise.all([
            load("f2"),
            loadAqKanji2Koe()
          ]);
          engine = voice;
          converter = kanaConverter;
          return true;
        })().catch(error => {
          enginePromise = null;
          throw error;
        });
      }
      return enginePromise;
    }

    function playBlob(wav, token) {
      return new Promise((resolve, reject) => {
        if (token !== runToken) return resolve(false);
        clearAudio();
        currentUrl = URL.createObjectURL(new Blob([wav], { type: "audio/wav" }));
        currentAudio = new Audio(currentUrl);
        currentAudio.onended = () => {
          clearAudio();
          resolve(token === runToken);
        };
        currentAudio.onerror = () => {
          clearAudio();
          reject(new Error("音声を再生できませんでした。"));
        };
        currentAudio.play().catch(error => {
          clearAudio();
          reject(error);
        });
      });
    }

    async function startReading() {
      const lines = getLines();
      if (!lines.length) {
        status.textContent = "読み上げる文章を入力してください。";
        input.focus();
        return;
      }

      const token = ++runToken;
      isPlaying = true;
      playButton.disabled = true;
      stopButton.disabled = false;
      input.disabled = true;

      try {
        await loadEngine();
        if (token !== runToken) return;

        for (let i = 0; i < lines.length; i++) {
          if (token !== runToken) break;
          const line = lines[i];
          setCaption(line, i, lines.length);
          status.textContent = "読み上げ中…";

          const koe = converter.convert(line);
          const wav = engine.run(koe, 110);
          const completed = await playBlob(wav, token);
          if (!completed) break;
        }

        if (token === runToken) {
          status.textContent = "読み上げが完了しました。";
          counter.textContent = "完了";
        }
      } catch (error) {
        console.error(error);
        if (token === runToken) {
          status.textContent = "読み込み・再生に失敗しました。通信環境を確認して、もう一度お試しください。";
        }
      } finally {
        if (token === runToken) {
          isPlaying = false;
          playButton.disabled = false;
          stopButton.disabled = true;
          input.disabled = false;
        }
      }
    }

    function stopReading() {
      if (!isPlaying) return;
      runToken++;
      isPlaying = false;
      clearAudio();
      playButton.disabled = false;
      stopButton.disabled = true;
      input.disabled = false;
      status.textContent = "停止しました。";
      counter.textContent = "停止";
    }

    input.addEventListener("input", updateLineCount);
    playButton.addEventListener("click", startReading);
    stopButton.addEventListener("click", stopReading);
    clearButton.addEventListener("click", () => {
      stopReading();
      input.value = "";
      updateLineCount();
      caption.textContent = "ここに読み上げ中の文章が表示されます";
      caption.classList.add("empty");
      counter.textContent = "待機中";
      status.textContent = "クリアしました。";
    });
    updateLineCount();

    window.addEventListener("beforeunload", () => {
      clearAudio();
      engine?.destroy();
      converter?.destroy();
    });
  </script>
</body>
</html>
